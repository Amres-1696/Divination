<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="天衍 · DESTINY — 基于易经六十四卦的在线占卜">
    <meta name="theme-color" content="#0f0e12">
    <title>天衍 · DESTINY</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@400;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@400;600;700&display=swap">
    </noscript>
    <link rel="stylesheet" href="style.css">
    <script src="html2canvas.min.js" defer></script>
</head>
<body>
    <!-- 呼吸光晕:页面唯一的环境层 -->
    <div class="veil" aria-hidden="true"></div>
    <!-- 回到顶部的哨兵:IntersectionObserver 观察它代替 scroll 监听 -->
    <div id="topSentinel" aria-hidden="true"></div>

    <header class="topbar">
        <a class="topbar-brand" href="#" aria-label="天衍">天衍</a>
        <nav class="topbar-nav">
            <button class="topbar-link" id="historyBtn">卦册</button>
            <button class="topbar-link" id="settingsGear">设置</button>
        </nav>
    </header>

    <main class="shell">
        <section class="hero">
            <div class="hero-copy">
                <p class="hero-kicker">六十四卦 · 在线占卜</p>
                <h1 class="brand">
                    <span class="brand-char">天</span><span class="brand-char">衍</span>
                </h1>
                <p class="brand-latin">DESTINY</p>
                <p class="hero-sub">问一事,得一卦。心之所念,卦之所示。</p>

                <div class="ask">
                    <label class="ask-label" for="question">所问之事</label>
                    <div class="ask-row">
                        <input type="text" id="question" placeholder="此刻心中所念" autocomplete="off" maxlength="60">
                        <button class="btn-divine" id="divineBtn">
                            <span class="btn-text">起卦</span>
                        </button>
                    </div>
                </div>

                <button class="daily-gua" id="dailyGua" type="button"></button>
            </div>

            <div class="hero-glyph" aria-hidden="true">
                <div class="glyph-lines" id="heroGlyph"></div>
                <div class="glyph-caption" id="heroGlyphName"></div>
            </div>
        </section>

        <section id="resultArea" aria-live="polite"></section>

        <footer class="footer">
            <p>此为占卜游戏 · 命运系于自身</p>
            <p class="footer-mark">© 2026 天衍 DESTINY</p>
        </footer>
    </main>

    <!-- 设置抽屉 -->
    <div class="drawer-overlay" id="settingsOverlay"></div>
    <aside class="drawer" id="settingsPanel" aria-label="设置">
        <div class="drawer-head">
            <h3>设置</h3>
            <button class="drawer-close" id="settingsCloseBtn" aria-label="关闭">×</button>
        </div>
        <div class="drawer-body">
            <div class="set-group">
                <div class="set-label">起卦方式</div>
                <select class="set-select" id="settingMethod">
                    <option value="coin">铜钱法 · 三枚铜钱</option>
                    <option value="bazi">八字起卦 · 生辰八字</option>
                </select>
                <div class="set-hint">八字起卦需先填写并保存生辰八字</div>
            </div>
            <div class="set-group">
                <div class="set-label">生辰八字</div>
                <div class="bazi-grid" id="baziGrid">
                    <label class="bazi-cell" for="baziYear">
                        <span class="bazi-cell-label">年</span>
                        <input type="number" id="baziYear" class="bazi-input" placeholder="1996" min="1900" max="2100" inputmode="numeric">
                    </label>
                    <label class="bazi-cell" for="baziMonth">
                        <span class="bazi-cell-label">月</span>
                        <select id="baziMonth" class="bazi-input">
                            <option value="">选择</option>
                            <option value="1">正</option><option value="2">二</option>
                            <option value="3">三</option><option value="4">四</option>
                            <option value="5">五</option><option value="6">六</option>
                            <option value="7">七</option><option value="8">八</option>
                            <option value="9">九</option><option value="10">十</option>
                            <option value="11">冬</option><option value="12">腊</option>
                        </select>
                    </label>
                    <label class="bazi-cell" for="baziDay">
                        <span class="bazi-cell-label">日</span>
                        <input type="number" id="baziDay" class="bazi-input" placeholder="16" min="1" max="31" inputmode="numeric">
                    </label>
                    <label class="bazi-cell" for="baziHour">
                        <span class="bazi-cell-label">时</span>
                        <select id="baziHour" class="bazi-input">
                            <option value="">选择</option>
                            <option value="0">子 23-1</option><option value="1">丑 1-3</option>
                            <option value="2">寅 3-5</option><option value="3">卯 5-7</option>
                            <option value="4">辰 7-9</option><option value="5">巳 9-11</option>
                            <option value="6">午 11-13</option><option value="7">未 13-15</option>
                            <option value="8">申 15-17</option><option value="9">酉 17-19</option>
                            <option value="10">戌 19-21</option><option value="11">亥 21-23</option>
                        </select>
                    </label>
                </div>
                <button class="btn-line" id="saveBaziBtn">保存八字</button>
                <div class="bazi-status" id="baziStatus" role="status"></div>
            </div>
            <div class="set-group">
                <div class="set-row">
                    <span class="set-label">每日一卦</span>
                    <label class="toggle">
                        <input type="checkbox" id="settingDaily" checked>
                        <span class="toggle-track"></span>
                    </label>
                </div>
                <div class="set-hint">首页显示今日卦象与箴言</div>
            </div>
        </div>
    </aside>

    <!-- 卦册抽屉 -->
    <div class="drawer-overlay" id="historyOverlay"></div>
    <aside class="drawer" id="historyPanel" aria-label="卦册">
        <div class="drawer-head">
            <h3>卦册</h3>
            <button class="drawer-close" id="historyCloseBtn" aria-label="关闭">×</button>
        </div>
        <div class="drawer-body" id="historyList"></div>
        <button class="btn-line btn-danger" id="clearHistoryBtn">清空卦册</button>
    </aside>

    <!-- 分享图弹层 -->
    <div class="share-overlay" id="shareImageContainer">
        <div class="share-box">
            <h3>分享卡片</h3>
            <div class="share-preview" id="shareImagePreview">生成中</div>
            <div class="share-actions">
                <button class="btn-solid" id="shareDownloadBtn">下载图片</button>
                <button class="btn-line" id="shareCopyBtn">复制图片</button>
                <button class="btn-ghost" id="closeShareBtn">关闭</button>
            </div>
        </div>
    </div>

    <button class="back-to-top" id="backToTop" aria-label="回到顶部">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="18 15 12 9 6 15"/>
        </svg>
    </button>

    <div class="toast-container" id="toastContainer"></div>

    <div class="confirm-overlay" id="confirmOverlay">
        <div class="confirm-box">
            <div class="confirm-msg" id="confirmMsg"></div>
            <div class="confirm-actions">
                <button class="btn-line" id="confirmNo">取消</button>
                <button class="btn-solid" id="confirmYes">确定</button>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
