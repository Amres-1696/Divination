                    <label class="bazi-seal" for="baziDay">
                        <span class="seal-label">日</span>
                        <input type="number" id="baziDay" class="seal-input" placeholder="—" min="1" max="31" inputmode="numeric">
                    </label>
                    <label class="bazi-seal bazi-seal-hour" for="baziHour">
                        <span class="seal-label">时</span>
                        <select id="baziHour" class="seal-input seal-input-hour">
                            <option value="">—</option>
                            <option value="0" data-range="23-1">子</option>
                            <option value="1" data-range="1-3">丑</option>
                            <option value="2" data-range="3-5">寅</option>
                            <option value="3" data-range="5-7">卯</option>
                            <option value="4" data-range="7-9">辰</option>
                            <option value="5" data-range="9-11">巳</option>
                            <option value="6" data-range="11-13">午</option>
                            <option value="7" data-range="13-15">未</option>
                            <option value="8" data-range="15-17">申</option>
                            <option value="9" data-range="17-19">酉</option>
                            <option value="10" data-range="19-21">戌</option>
                            <option value="11" data-range="21-23">亥</option>
                        </select>
                    </label>
                </div>
                <button class="btn-save-bazi" id="saveBaziBtn">保存八字</button>
                <div class="bazi-status" id="baziStatus"></div>
            </div>
            <div class="settings-group">
                <div class="settings-row-toggle">
                    <span class="settings-label">每日启示</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="settingDaily" checked>
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                <div class="settings-hint">首页显示每日一卦与箴言</div>
            </div>
            <div class="settings-group">
                <div class="settings-row-toggle">
                    <span class="settings-label">蜡烛显示</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="settingCandle" checked>
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                <div class="settings-hint">两侧烛台火焰效果</div>
            </div>
        </div>
    </div>
    <div class="history-overlay" id="historyOverlay"></div>
    <div class="history-panel" id="historyPanel">
        <div class="history-head">
            <h3>牌册</h3>
            <button class="btn-close" id="historyCloseBtn">×</button>
        </div>
        <div id="historyList"></div>
        <button class="btn-clear" id="clearHistoryBtn">清空牌册</button>
    </div>
    <div class="share-overlay" id="shareImageContainer">
        <div class="share-box">
            <h3>分享卡片</h3>
            <div class="share-preview" id="shareImagePreview">生成中…</div>
            <div class="share-actions">
                <button class="btn-download" id="shareDownloadBtn">下载图片</button>
                <button class="btn-copy" id="shareCopyBtn">复制图片</button>
                <button class="btn-close-share" id="closeShareBtn">关闭</button>
            </div>
        </div>
    </div>

    <!-- 回到顶部 -->
    <button class="back-to-top" id="backToTop" aria-label="回到顶部">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="18 15 12 9 6 15"/>
        </svg>
    </button>

    <!-- Toast 提示 -->
    <div class="toast-container" id="toastContainer"></div>
    <!-- Confirm 弹窗 -->
    <div class="confirm-overlay" id="confirmOverlay">
        <div class="confirm-box">
            <div class="confirm-msg" id="confirmMsg"></div>
            <div class="confirm-actions">
                <button class="confirm-btn confirm-yes" id="confirmYes">确定</button>
                <button class="confirm-btn confirm-no" id="confirmNo">取消</button>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
