<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天衍 · Eastern Arcana</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
</head>
<body>
    <!-- L1 丝绒桌面 -->
    <div class="velvet-bg" aria-hidden="true"></div>

    <!-- L2 金线刺绣牌垫 -->
    <svg class="embroidery-mat" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        <g transform="translate(500 500)">
            <!-- L1 外环花体藤蔓 95~100% -->
            <g class="mat-l1">
                <circle r="495" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.38"/>
                <circle r="488" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.2"/>
                <g opacity="0.35">
                    <!-- 24 瓣唐草缠枝纹 -->
                    <g id="vineGroup">
                        <g id="vineUnit">
                            <path d="M 0,-492 Q 12,-478 8,-462 Q 4,-448 -4,-440 Q -10,-434 -6,-425" fill="none" stroke="currentColor" stroke-width="0.8"/>
                            <path d="M 8,-462 Q 16,-455 14,-445 Q 12,-438 6,-432" fill="none" stroke="currentColor" stroke-width="0.6"/>
                            <path d="M -4,-440 Q -12,-435 -16,-442 Q -18,-448 -12,-454" fill="none" stroke="currentColor" stroke-width="0.5"/>
                            <circle cx="0" cy="-492" r="1.2" fill="currentColor"/>
                        </g>
                        <use href="#vineUnit" transform="rotate(15)"/>
                        <use href="#vineUnit" transform="rotate(30)"/>
                        <use href="#vineUnit" transform="rotate(45)"/>
                        <use href="#vineUnit" transform="rotate(60)"/>
                        <use href="#vineUnit" transform="rotate(75)"/>
                        <use href="#vineUnit" transform="rotate(90)"/>
                        <use href="#vineUnit" transform="rotate(105)"/>
                        <use href="#vineUnit" transform="rotate(120)"/>
                        <use href="#vineUnit" transform="rotate(135)"/>
                        <use href="#vineUnit" transform="rotate(150)"/>
                        <use href="#vineUnit" transform="rotate(165)"/>
                        <use href="#vineUnit" transform="rotate(180)"/>
                        <use href="#vineUnit" transform="rotate(195)"/>
                        <use href="#vineUnit" transform="rotate(210)"/>
                        <use href="#vineUnit" transform="rotate(225)"/>
                        <use href="#vineUnit" transform="rotate(240)"/>
                        <use href="#vineUnit" transform="rotate(255)"/>
                        <use href="#vineUnit" transform="rotate(270)"/>
                        <use href="#vineUnit" transform="rotate(285)"/>
                        <use href="#vineUnit" transform="rotate(300)"/>
                        <use href="#vineUnit" transform="rotate(315)"/>
                        <use href="#vineUnit" transform="rotate(330)"/>
                        <use href="#vineUnit" transform="rotate(345)"/>
                    </g>
                </g>
            </g>

            <!-- L2 四方神兽锚点 80~85% -->
            <g class="mat-l2">
                <circle r="415" fill="none" stroke="currentColor" stroke-width="1" opacity="0.32"/>
                <circle r="409" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.18"/>
                <text x="0" y="-422" text-anchor="middle" font-family="ZCOOL XiaoWei, serif" font-size="24" fill="currentColor" opacity="0.48">朱</text>
                <text x="0" y="435" text-anchor="middle" font-family="ZCOOL XiaoWei, serif" font-size="24" fill="currentColor" opacity="0.48">玄</text>
                <text x="-422" y="8" text-anchor="middle" font-family="ZCOOL XiaoWei, serif" font-size="24" fill="currentColor" opacity="0.48">龙</text>
                <text x="422" y="8" text-anchor="middle" font-family="ZCOOL XiaoWei, serif" font-size="24" fill="currentColor" opacity="0.48">虎</text>
                <g opacity="0.3">
                    <circle cx="0" cy="-415" r="6" fill="currentColor"/>
                    <circle cx="0" cy="415" r="6" fill="currentColor"/>
                    <circle cx="-415" cy="0" r="6" fill="currentColor"/>
                    <circle cx="415" cy="0" r="6" fill="currentColor"/>
                </g>
            </g>

            <!-- L3 三才分位 58~68% -->
            <g class="mat-l3">
                <circle r="320" fill="none" stroke="currentColor" stroke-width="0.7" opacity="0.28"/>
                <circle r="315" fill="none" stroke="currentColor" stroke-width="0.3" opacity="0.15"/>
                <text x="0" y="-296" text-anchor="middle" font-family="ZCOOL XiaoWei, serif" font-size="14" fill="currentColor" opacity="0.5">天</text>
                <text x="-256" y="160" text-anchor="middle" font-family="ZCOOL XiaoWei, serif" font-size="14" fill="currentColor" opacity="0.5">人</text>
                <text x="256" y="160" text-anchor="middle" font-family="ZCOOL XiaoWei, serif" font-size="14" fill="currentColor" opacity="0.5">地</text>
            </g>

            <!-- L4 太极双环 38~48% 自转 -->
            <g class="mat-l4">
                <circle r="228" fill="none" stroke="currentColor" stroke-width="0.6" opacity="0.28"/>
                <circle r="220" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.15"/>
                <g class="taiji-outer">
                    <text x="0" y="-212" text-anchor="middle" font-size="22" fill="currentColor" opacity="0.5">☰</text>
                    <text x="150" y="-150" text-anchor="middle" font-size="22" fill="currentColor" opacity="0.5">☱</text>
                    <text x="212" y="8" text-anchor="middle" font-size="22" fill="currentColor" opacity="0.5">☲</text>
                    <text x="150" y="166" text-anchor="middle" font-size="22" fill="currentColor" opacity="0.5">☳</text>
                    <text x="0" y="228" text-anchor="middle" font-size="22" fill="currentColor" opacity="0.5">☷</text>
                    <text x="-150" y="166" text-anchor="middle" font-size="22" fill="currentColor" opacity="0.5">☶</text>
                    <text x="-212" y="8" text-anchor="middle" font-size="22" fill="currentColor" opacity="0.5">☵</text>
                    <text x="-150" y="-150" text-anchor="middle" font-size="22" fill="currentColor" opacity="0.5">☴</text>
                </g>
            </g>

            <!-- L5 中央牌位印记 20~30% -->
            <g class="mat-l5">
                <circle r="128" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.35"/>
                <circle r="120" fill="none" stroke="currentColor" stroke-width="0.25" opacity="0.2"/>
                <g opacity="0.5">
                    <polygon points="0,-110 95,-55 95,55 0,110 -95,55 -95,-55" fill="none" stroke="currentColor" stroke-width="0.4"/>
                    <polygon points="0,-110 95,55 -95,55" fill="none" stroke="currentColor" stroke-width="0.3" opacity="0.6"/>
                    <polygon points="0,110 -95,-55 95,-55" fill="none" stroke="currentColor" stroke-width="0.3" opacity="0.6"/>
                </g>
                <text x="0" y="-6" text-anchor="middle" font-family="ZCOOL XiaoWei, serif" font-size="44" fill="currentColor" opacity="0.65" letter-spacing="4">天</text>
                <text x="0" y="52" text-anchor="middle" font-family="ZCOOL XiaoWei, serif" font-size="44" fill="currentColor" opacity="0.65" letter-spacing="4">衍</text>
            </g>
        </g>
    </svg>

    <!-- 左烛台 -->
    <div class="candle candle-left" aria-hidden="true">
        <svg viewBox="0 0 60 170" preserveAspectRatio="xMidYMid meet">
            <rect x="25" y="90" width="10" height="70" fill="#e8d4a8" opacity="0.7"/>
            <rect x="22" y="87" width="16" height="4" fill="#c9a96e" opacity="0.85"/>
            <rect x="20" y="160" width="20" height="3" fill="#a0855a" opacity="0.75"/>
            <line x1="30" y1="90" x2="30" y2="80" stroke="#3a2a1a" stroke-width="1"/>
            <ellipse class="flame-halo" cx="30" cy="62" rx="16" ry="26" fill="#f4c47a" opacity="0.18"/>
            <path class="flame" d="M 30 80 Q 22 64 30 44 Q 38 64 30 80 Z" fill="#f4c47a"/>
            <path class="flame-inner" d="M 30 78 Q 26 68 30 56 Q 34 68 30 78 Z" fill="#fff4c4" opacity="0.75"/>
        </svg>
    </div>

    <!-- 右烛台 -->
    <div class="candle candle-right" aria-hidden="true">
        <svg viewBox="0 0 60 170" preserveAspectRatio="xMidYMid meet">
            <rect x="25" y="90" width="10" height="70" fill="#e8d4a8" opacity="0.7"/>
            <rect x="22" y="87" width="16" height="4" fill="#c9a96e" opacity="0.85"/>
            <rect x="20" y="160" width="20" height="3" fill="#a0855a" opacity="0.75"/>
            <line x1="30" y1="90" x2="30" y2="80" stroke="#3a2a1a" stroke-width="1"/>
            <ellipse class="flame-halo" cx="30" cy="62" rx="16" ry="26" fill="#f4c47a" opacity="0.18"/>
            <path class="flame" d="M 30 80 Q 22 64 30 44 Q 38 64 30 80 Z" fill="#f4c47a"/>
            <path class="flame-inner" d="M 30 78 Q 26 68 30 56 Q 34 68 30 78 Z" fill="#fff4c4" opacity="0.75"/>
        </svg>
    </div>

    <!-- 右上角设置按钮 -->
    <button class="settings-gear" onclick="toggleSettings()" aria-label="设置">⚙</button>

    <!-- 浮尘 Canvas -->
    <canvas class="dust-layer" aria-hidden="true"></canvas>

    <div class="container">
        <header>
            <div class="arcanum-header">
                <span class="deco-line"></span>
                <span class="deco-mark">✦</span>
                <span class="deco-line"></span>
            </div>
            <div class="title-seal">
                <div class="title-main">天衍</div>
                <div class="title-roman">EASTERN · ARCANA</div>
            </div>
            <div class="subtitle">六十四卦 · 奥义读牌</div>
            <div class="arcanum-header">
                <span class="deco-line"></span>
                <span class="deco-mark">✦</span>
                <span class="deco-line"></span>
            </div>
        </header>

        <!-- 每日一卦 -->
        <div class="daily-gua" id="dailyGua"></div>

        <div class="question-area">
            <span class="question-label">INQUIRY · 所问之事</span>
            <input type="text" id="question" placeholder="心之所念 · 卦之所示">
        </div>

        <div class="btn-group">
            <button class="btn-divine" id="divineBtn" onclick="divine()">
                <span class="btn-rune">✧</span>
                <span class="btn-text">起 卦</span>
                <span class="btn-rune">✧</span>
            </button>
            <button class="btn-history" onclick="toggleHistory()">
                <span class="btn-rune">◱</span>
                <span class="btn-text">牌 册</span>
            </button>
        </div>

        <div id="resultArea"></div>

        <footer>
            <p>此为占卜游戏 · 命运系于自身</p>
            <p>&copy; 2026 · 天衍 EASTERN ARCANA</p>
        </footer>
    </div>

    <!-- 设置遮罩 -->
    <div class="history-overlay" id="settingsOverlay" onclick="toggleSettings()"></div>

    <!-- 设置面板 -->
    <div class="history-panel settings-panel" id="settingsPanel">
        <div class="history-head">
            <h3>设 置</h3>
            <button class="btn-close" onclick="toggleSettings()">闭</button>
        </div>
        <div class="settings-content">
            <!-- 算卦方式 -->
            <div class="settings-group">
                <div class="settings-label">算 卦 方 式</div>
                <select class="settings-select" id="settingMethod" onchange="saveSetting('method', this.value)">
                    <option value="coin">铜钱法（三枚铜钱）</option>
                    <option value="bazi">八字起卦（生辰八字）</option>
                </select>
                <div class="settings-hint">八字起卦需先填写生辰八字信息</div>
            </div>

            <!-- 生辰八字 -->
            <div class="settings-group">
                <div class="settings-label">生 辰 八 字</div>
                <div class="bazi-form">
                    <div class="bazi-row">
                        <label>出生年份</label>
                        <input type="number" id="baziYear" placeholder="如 1990" min="1900" max="2100">
                    </div>
                    <div class="bazi-row">
                        <label>出生月份</label>
                        <select id="baziMonth">
                            <option value="">请选择</option>
                            <option value="1">正月（1月）</option>
                            <option value="2">二月（2月）</option>
                            <option value="3">三月（3月）</option>
                            <option value="4">四月（4月）</option>
                            <option value="5">五月（5月）</option>
                            <option value="6">六月（6月）</option>
                            <option value="7">七月（7月）</option>
                            <option value="8">八月（8月）</option>
                            <option value="9">九月（9月）</option>
                            <option value="10">十月（10月）</option>
                            <option value="11">冬月（11月）</option>
                            <option value="12">腊月（12月）</option>
                        </select>
                    </div>
                    <div class="bazi-row">
                        <label>出生日期</label>
                        <input type="number" id="baziDay" placeholder="如 15" min="1" max="31">
                    </div>
                    <div class="bazi-row">
                        <label>出生时辰</label>
                        <select id="baziHour">
                            <option value="">请选择</option>
                            <option value="0">子时（23:00-01:00）</option>
                            <option value="1">丑时（01:00-03:00）</option>
                            <option value="2">寅时（03:00-05:00）</option>
                            <option value="3">卯时（05:00-07:00）</option>
                            <option value="4">辰时（07:00-09:00）</option>
                            <option value="5">巳时（09:00-11:00）</option>
                            <option value="6">午时（11:00-13:00）</option>
                            <option value="7">未时（13:00-15:00）</option>
                            <option value="8">申时（15:00-17:00）</option>
                            <option value="9">酉时（17:00-19:00）</option>
                            <option value="10">戌时（19:00-21:00）</option>
                            <option value="11">亥时（21:00-23:00）</option>
                        </select>
                    </div>
                </div>
                <button class="btn-save-bazi" onclick="saveBazi()">保 存 八 字</button>
                <div class="bazi-status" id="baziStatus"></div>
            </div>

            <!-- 每日启示 -->
            <div class="settings-group">
                <div class="settings-row-toggle">
                    <span class="settings-label">每 日 启 示</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="settingDaily" onchange="saveSetting('showDaily', this.checked)" checked>
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                <div class="settings-hint">首页显示每日一卦与箴言</div>
            </div>

            <!-- 蜡烛显示 -->
            <div class="settings-group">
                <div class="settings-row-toggle">
                    <span class="settings-label">蜡 烛 显 示</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="settingCandle" onchange="saveSetting('showCandle', this.checked)" checked>
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                <div class="settings-hint">两侧烛台火焰效果</div>
            </div>
        </div>
    </div>

    <!-- 历史遮罩 -->
    <div class="history-overlay" id="historyOverlay" onclick="toggleHistory()"></div>

    <!-- 历史面板（牌册） -->
    <div class="history-panel" id="historyPanel">
        <div class="history-head">
            <h3>牌 册</h3>
            <button class="btn-close" onclick="toggleHistory()">闭</button>
        </div>
        <div id="historyList"></div>
        <button class="btn-clear" onclick="clearHistory()">清 空 牌 册</button>
    </div>

    <!-- 分享弹窗 -->
    <div class="share-overlay" id="shareImageContainer">
        <div class="share-box">
            <h3>分享卡片</h3>
            <div class="share-preview" id="shareImagePreview">生成中…</div>
            <div class="share-actions">
                <button class="btn-download" id="shareDownloadBtn">下载图片</button>
                <button class="btn-copy" id="shareCopyBtn">复制图片</button>
                <button class="btn-close-share" onclick="closeShare()">关闭</button>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
