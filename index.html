<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天衍 · 周易占卜</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <div class="title-vertical">天衍</div>
            <div class="subtitle">周易六十四卦</div>
            <div class="seal">易</div>
        </header>

        <!-- 每日一卦 -->
        <div class="daily-gua" id="dailyGua"></div>

        <!-- 起卦模式切换 -->
        <div class="mode-switch">
            <button class="mode-btn active" id="modeRandom" onclick="switchMode('random')">随机起卦</button>
            <button class="mode-btn" id="modeBazi" onclick="switchMode('bazi')">生辰起卦</button>
        </div>

        <!-- 生辰八字输入区 -->
        <div class="bazi-area" id="baziArea">
            <div class="bazi-label">出生时辰</div>
            <div class="bazi-inputs">
                <div class="bazi-field">
                    <label>年</label>
                    <input type="number" id="baziYear" min="1900" max="2100" placeholder="如 1990">
                </div>
                <div class="bazi-field">
                    <label>月</label>
                    <select id="baziMonth">
                        <option value="">月</option>
                        <option value="1">正月</option><option value="2">二月</option>
                        <option value="3">三月</option><option value="4">四月</option>
                        <option value="5">五月</option><option value="6">六月</option>
                        <option value="7">七月</option><option value="8">八月</option>
                        <option value="9">九月</option><option value="10">十月</option>
                        <option value="11">冬月</option><option value="12">腊月</option>
                    </select>
                </div>
                <div class="bazi-field">
                    <label>日</label>
                    <input type="number" id="baziDay" min="1" max="31" placeholder="日">
                </div>
                <div class="bazi-field">
                    <label>时辰</label>
                    <select id="baziShichen">
                        <option value="">选择</option>
                        <option value="0">子时 (23-1)</option>
                        <option value="1">丑时 (1-3)</option>
                        <option value="2">寅时 (3-5)</option>
                        <option value="3">卯时 (5-7)</option>
                        <option value="4">辰时 (7-9)</option>
                        <option value="5">巳时 (9-11)</option>
                        <option value="6">午时 (11-13)</option>
                        <option value="7">未时 (13-15)</option>
                        <option value="8">申时 (15-17)</option>
                        <option value="9">酉时 (17-19)</option>
                        <option value="10">戌时 (19-21)</option>
                        <option value="11">亥时 (21-23)</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="question-area">
            <span class="question-label">所问之事</span>
            <input type="text" id="question" placeholder="心之所念，卦之所示">
        </div>

        <div class="btn-group">
            <button class="btn-divine" id="divineBtn" onclick="divine()">起卦</button>
            <button class="btn-history" onclick="toggleHistory()">历史</button>
        </div>

        <div id="resultArea"></div>

        <footer>
            <p>本工具仅供娱乐参考，命运掌握在自己手中</p>
            <p>&copy; 2026 天衍 · 基于《周易》六十四卦</p>
        </footer>
    </div>

    <!-- 历史面板 -->
    <div class="history-panel" id="historyPanel">
        <div class="history-head">
            <h3>占卜历史</h3>
            <button class="btn-close" onclick="toggleHistory()">关闭</button>
        </div>
        <div id="historyList"></div>
        <button class="btn-clear" onclick="clearHistory()">清空历史</button>
    </div>

    <!-- 分享弹窗 -->
    <div class="share-overlay" id="shareImageContainer">
        <div class="share-box">
            <h3>分享卡片</h3>
            <div class="share-preview" id="shareImagePreview">生成中…</div>
            <div class="share-actions">
                <button class="btn-download" id="shareDownloadBtn">下载图片</button>
                <button class="btn-copy" id="shareCopyBtn">复制图片</button>
                <button class="btn-close-share" onclick="closeShare()">关闭</button>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
